# Reload the file with Prefix r.
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Enable mouse everywhere (panes, resize, scroll, select window)
set -g mouse on

# Let tmux copy to system clipboard via OSC 52.
# `set-clipboard on` only emits OSC 52 if the outer terminal's terminfo
# advertises it (the `Ms` capability). Most TERMs don't, so we force-enable
# the `clipboard` feature for the terminals we actually use.
set -s set-clipboard on
set -as terminal-features ',alacritty*:clipboard'
set -as terminal-features ',xterm*:clipboard'
set -as terminal-features ',tmux*:clipboard'

# Better copy-mode keys (vi style)
setw -g mode-keys vi

# Word boundaries for select-word (double-click). tmux's default excludes
# space, so the whole line ends up "one word". This keeps paths/dashed names
# intact while breaking on structural punctuation.
set -g word-separators " ()[]{}<>|"

# In copy-mode, drag with mouse to select and copy on release — stay in
# copy-mode so the scrollback position doesn't reset. Press `q` to exit.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Double/triple-click: select a word/line and stay in copy-mode (tmux 3.6's
# defaults call copy-pipe-and-cancel which yanks you out of scrollback).
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind-key -T root DoubleClick1Pane \
	select-pane -t = \; \
	if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
		{ send-keys -M } \
		{ copy-mode -H ; send-keys -X select-word }
bind-key -T root TripleClick1Pane \
	select-pane -t = \; \
	if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
		{ send-keys -M } \
		{ copy-mode -H ; send-keys -X select-line }

# Create new windows/splits following current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Use C to create new window in default-dir
bind C new-window

# Splitting panes.
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"

# Moving between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Moving between windows.
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Screen type switching between panes
bind C-b last-window

# prevent prefix + ctrl-z from pushing tmux to background
unbind C-z

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# zoom into a pane
bind z resize-pane -Z

# Log output to a text file on demand.
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# Show the pane numbers for a bit longer.
# C-B q <N> moves to that pane.
set -g display-panes-time 2000 # in ms

# start pane numbers from 1
set -g pane-base-index 1

# Enable activity alerts.
setw -g monitor-activity on
set -g visual-activity on

# Enable vi keys.
setw -g mode-keys vi

# Status bar
set -g status-position bottom
set -g status-right '%a %H:%M %d-%m-%Y '

setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off

# don't confirm just kill!
bind & kill-window

# Rename window screen style
unbind ,
bind-key A command-prompt -I "#W" "rename-window '%%'"

# don't rename windows automatically
set-option -g allow-rename off

# Set history to some reasonably large number
# Note: This will pre-allocate that many lines (and hence memory) for all
# windows
set -g history-limit 100000

# Copy mode workflow:
#  - v to trigger selection
#  - y to yank current selection
#  - paste with Ctrl-P
#  - Ctrl-d/Ctrl-u to page up and page down
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection
bind P paste-buffer

run-shell 'bash ~/.config/tmux/theme.tmux'
run-shell 'bash ~/.config/tmux/sensible.tmux'
